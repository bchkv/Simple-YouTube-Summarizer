[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "summarizer"
version = "0.1.0"
description = "Universal CLI Summarizer — summarize YouTube, PDFs, media, and text via OpenAI"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "openai>=2.0",
    "python-dotenv>=1.0",
    "yt-dlp>=2024.0",
]

[project.optional-dependencies]
local-transcribe = [
    "mlx-whisper>=0.4",
]
faster-transcribe = [
    "faster-whisper>=1.1",
]
pdf = [
    "pymupdf>=1.24",
    "pdf2image>=1.17",
    "pytesseract>=0.3",
    "Pillow>=10.0",
]

[project.scripts]
summarize = "summarizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
